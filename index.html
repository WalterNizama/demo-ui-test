<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>💘 Preguntita importante</title>
  <style>
    :root{
      --bg1:#ffdde1; --bg2:#ee9ca7; --card:#ffffffcc;
      --text:#2b2b2b; --yes:#22c55e; --no:#ef4444;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background: radial-gradient(circle at 20% 20%, #fff 0, transparent 35%),
                  radial-gradient(circle at 80% 10%, #fff 0, transparent 30%),
                  linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow:hidden;
      padding:16px;
    }
    .card{
      width:min(520px, 100%);
      background:var(--card);
      backdrop-filter: blur(10px);
      border:1px solid #ffffff80;
      border-radius:24px;
      padding:22px;
      box-shadow: 0 18px 50px #00000025;
      text-align:center;
      position:relative;
    }
    h1{font-size:28px; margin:6px 0 10px}
    p{margin:0 0 16px; line-height:1.35}
    .buttons{
      position:relative;
      height:120px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:14px;
    }
    button{
      border:0;
      padding:14px 18px;
      border-radius:14px;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      box-shadow: 0 10px 20px #00000020;
      transition: transform .12s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active{transform: scale(0.98)}
    #yesBtn{background:var(--yes); color:white;}
    #noBtn{
      background:var(--no); color:white;
      position:absolute; /* para poder moverlo */
      left:50%;
      top:50%;
      transform: translate(80px, -50%);
      touch-action: none;
    }

    .result{
      display:none;
      margin-top:14px;
      animation: pop .35s ease both;
    }
    @keyframes pop{
      from{transform: translateY(8px); opacity:0}
      to{transform: translateY(0); opacity:1}
    }
    .imgWrap{
      margin-top:12px;
      border-radius:18px;
      overflow:hidden;
      border:1px solid #ffffff80;
      box-shadow: 0 10px 30px #00000018;
    }
    img{
      width:100%;
      display:block;
      aspect-ratio: 4/3;
      object-fit: cover;
    }
    .small{
      font-size:13px;
      opacity:.8;
      margin-top:10px;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div id="question">
      <h1>💌 Te quería preguntar algo…</h1>
      <p style="font-size:18px">¿Te gustaría ser mi <b>San Valentín</b>? 🥺💘</p>

      <div class="buttons" id="arena">
        <button id="yesBtn">Sí 💚</button>
        <button id="noBtn">No 💔</button>
      </div>

      <p class="small">*Pista: el “No” es tímido 😅</p>
    </div>

    <div class="result" id="result">
      <h1>AAAAA 😭💖</h1>
      <p style="font-size:18px">
        Prometo hacer de este San Valentín un día hermoso contigo. 🌹✨<br/>
        Gracias por decir que sí. Te quiero muchísimo. 🫶
      </p>

      <div class="imgWrap">
        <!-- Cambia la imagen por una tuya: por ejemplo img/nosotros.jpg -->
        <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1200&q=80" alt="San Valentín" />
      </div>

      <p class="small">💘 Hecho con cariño.</p>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const result = document.getElementById("result");
    const question = document.getElementById("question");
    const arena = document.getElementById("arena");

    function moveNoButton() {
      const a = arena.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      // Márgenes para que no se pegue al borde
      const margin = 8;

      const maxX = a.width - b.width - margin*2;
      const maxY = a.height - b.height - margin*2;

      const x = Math.max(margin, Math.floor(Math.random() * maxX));
      const y = Math.max(margin, Math.floor(Math.random() * maxY));

      // Posicionar relativo al contenedor "arena"
      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
      noBtn.style.transform = "translate(0,0)";
    }

    // En PC: cuando acerque el mouse, se mueve
    noBtn.addEventListener("mouseenter", moveNoButton);

    // En celular: cuando intente tocarlo, se mueve
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNoButton();
    }, { passive:false });

    // También si hace click (por si logra darle)
    noBtn.addEventListener("click", moveNoButton);

    yesBtn.addEventListener("click", () => {
      question.style.display = "none";
      result.style.display = "block";
    });

    // Posición inicial más “real”
    window.addEventListener("load", () => {
      // Poner el "No" en una posición inicial dentro del arena
      noBtn.style.left = "60%";
      noBtn.style.top = "50%";
      noBtn.style.transform = "translate(0, -50%)";
    });
  </script>
</body>
</html>
